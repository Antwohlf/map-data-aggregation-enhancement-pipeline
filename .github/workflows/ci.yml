name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22.13.0, 22, 24]
        os: [macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run validate:example
      - run: npm run preview:apizza-fsq -- --runtime-root "$RUNNER_TEMP/apizza-fsq-preview" --run-id "ci-${{ matrix.node }}"
      - run: npm run audit:public
      - run: npm audit --audit-level=high

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizza_enrichment
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pizza_enrichment"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          MAP_PIPELINE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/pizza_enrichment
      - run: node --test packages/food-runtime/test/website-provenance.integration.test.mjs packages/food-runtime/test/supabase-sync-identity.integration.test.mjs packages/food-runtime/test/supabase-sync-replay.integration.test.mjs
        env:
          MAP_PIPELINE_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/pizza_enrichment

  postgres-provision-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizza_enrichment
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pizza_enrichment"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres-provision
        env:
          MAP_PIPELINE_TEST_POSTGRES_PROVISION_URL: postgresql://postgres@127.0.0.1:5432/pizza_enrichment
