<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant quality desk</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="brand">A Pizza Michigan <span>/</span> Operations</span><span id="freshness" role="status">Loading snapshot…</span><button id="reload">Reload snapshot</button></header>
<main><div class="intro"><div><p class="eyebrow">DATA REVIEW</p><h1>Restaurant quality desk</h1><p id="scope">Checking the latest exported evidence.</p></div><div class="metrics" id="metrics"></div></div>
<div id="error" role="alert" hidden></div><section class="workspace"><aside class="queues"><h2>Review queues</h2><nav id="categories" aria-label="Issue type"></nav><p class="note">Flags identify records to investigate. Possible duplicates are never merged automatically.</p></aside><section class="results"><div class="toolbar"><label>Product<select id="entity"><option value="all">Pizza + Taco</option><option value="pizza">Pizza</option><option value="taco">Taco</option></select></label><label class="search">Find a restaurant<input id="search" type="search" placeholder="Name, state, source ID, or record ID"></label><button id="export">Export filtered CSV</button></div><p id="coverage" class="note"></p><div class="split"><div class="list"><div id="rows" aria-label="Quality findings"></div><div class="pagination"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></div><section id="detail" aria-label="Selected finding"><p>Select a finding to review the evidence.</p></section></div></section></section><footer id="foot"></footer></main>
<script src="dashboard.js"></script></body></html>
